name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install pytest ruff tzdata
      - run: python -m pytest
      - run: ruff check .
      - run: python -m compileall -q custom_components tools
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check preview/app.js
      - run: node --test preview/test-preview.cjs
      - run: node --check preview/project-model.js
      - run: node --check preview/project-ui.js
      - run: node --test preview/test-project.cjs
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            custom_components/pohl_solutions_energiemanager/manifest.json
      - run: python -m pip install homeassistant==2026.1.0
      - run: python tools/ha_smoke.py
